<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fullscreen Video Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app" id="appRoot">
      <video id="player" playsinline preload="auto"></video>

      <section class="menu" id="menuScreen">
        <button id="playBtn" class="play-btn" type="button">Play</button>
      </section>

      <section class="watch-check" id="watchCheck" role="dialog" aria-modal="true" hidden>
        <div class="watch-check__card">
          <h1 id="watchCheckMessage">Are you still watching?</h1>
          <div class="watch-check__actions">
            <button id="stillHereBtn" class="action-btn action-btn--yes" type="button">Yes, I am still watching</button>
            <button id="leaveBtn" class="action-btn action-btn--no" type="button">No, close site</button>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
